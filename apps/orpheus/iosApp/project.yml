name: OrpheusApp
options:
  bundleIdPrefix: org.balch.orpheus
  deploymentTarget:
    iOS: "15.0"
settings:
  # Set your Apple team ID here, then run: xcodegen generate
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
targets:
  OrpheusApp:
    type: application
    platform: iOS
    sources:
      - path: OrpheusApp
        excludes:
          - Info.plist
    info:
      path: OrpheusApp/Info.plist
      properties:
        CFBundleDisplayName: "Orphic FM"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "Camera is used for hand tracking to control the synthesizer"
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect MIDI controllers"
        UILaunchStoryboardName: LaunchScreen
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.balch.orpheus.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
      FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "OrpheusShared"
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # The static framework reads Compose resources from <app>/compose-resources/. Nothing in a
    # bare xcodegen build copies them there; the gradle framework link aggregates them (see
    # apps/orpheus/shared/build.gradle.kts). Same phase as apps/djapp/iosApp/project.yml.
    postBuildScripts:
      - name: Copy Compose Resources
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in
            iphoneos) KMP_TARGET=iosArm64 ;;
            iphonesimulator) KMP_TARGET=iosSimulatorArm64 ;;
            *) echo "warning: unsupported PLATFORM_NAME='$PLATFORM_NAME' — skipping compose resources"; exit 0 ;;
          esac
          SRC="$SRCROOT/../shared/build/kotlin-multiplatform-resources/aggregated-resources/$KMP_TARGET"
          DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete "$SRC/" "$DST/"
            echo "Copied compose resources ($KMP_TARGET) into $DST"
          else
            echo "warning: no compose resources at $SRC — run the gradle framework build first"
          fi
