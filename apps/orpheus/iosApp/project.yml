name: OrpheusApp
options:
  bundleIdPrefix: org.balch.orpheus
  deploymentTarget:
    iOS: "15.0"
settings:
  # Set your Apple team ID here, then run: xcodegen generate
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
targets:
  OrpheusApp:
    type: application
    platform: iOS
    sources:
      - path: OrpheusApp
        excludes:
          - Info.plist
    info:
      path: OrpheusApp/Info.plist
      properties:
        CFBundleDisplayName: "Orphic FM"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "Camera is used for hand tracking to control the synthesizer"
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect MIDI controllers"
        UILaunchStoryboardName: LaunchScreen
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.balch.orpheus.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
        - "$(inherited)"
        - "$(SRCROOT)/../build/bin/iosArm64/debugFramework"
      FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
        - "$(inherited)"
        - "$(SRCROOT)/../build/bin/iosSimulatorArm64/debugFramework"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "OrpheusShared"
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
