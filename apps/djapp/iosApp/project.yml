name: DjApp
options:
  bundleIdPrefix: org.balch.djapp
  deploymentTarget:
    iOS: "15.0"
settings:
  DEVELOPMENT_TEAM: "X5YQC8CHTP"
  CODE_SIGN_STYLE: Automatic
targets:
  DjApp:
    type: application
    platform: iOS
    sources:
      - path: DjApp
        excludes:
          - Info.plist
      - path: DjAppWidgetShared
    info:
      path: DjApp/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect MIDI controllers"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Required once linked against the iOS 27 SDK: without it UIKit traps on launch.
        # One scene only, since every window would share the single process-level graph.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.balch.djapp.app
        CODE_SIGN_ENTITLEMENTS: DjApp/DjApp.entitlements
        APP_DISPLAY_NAME: "Orphic DJ"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "DjAppShared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # iPhone and iPad. iPad matters beyond the extra screen size: the large-screen
        # dock needs a canvas of at least 900x500dp, and an iPhone-only build runs
        # letterboxed at phone dimensions on an iPad, so it could never reach it. This
        # also activates the UISupportedInterfaceOrientations~ipad block above.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Fallback for ad-hoc Xcode builds; the archive script overrides both
        # from git (nearest tag / total commit count) — see build-logic's
        # orpheus.android.app.gradle.kts for the Android-side equivalent.
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "3"
      configs:
        Debug:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        Release:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
    dependencies:
      - target: DjWidgetExtension
    # Compose Multiplatform resources (album art posters etc.) are read at
    # runtime from <app bundle>/compose-resources/ (the CMP iOS reader's
    # fallback for statically linked frameworks). The bare xcodegen build has
    # no embedAndSignAppleFrameworkForXcode integration to copy them, so do
    # it here. Source tree is produced by the gradle framework link (the
    # link*FrameworkIos* tasks depend on *AggregateResources — see
    # apps/djapp/shared/build.gradle.kts).
    postBuildScripts:
      - name: Copy Compose Resources
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in
            iphoneos) KMP_TARGET=iosArm64 ;;
            iphonesimulator) KMP_TARGET=iosSimulatorArm64 ;;
            *) echo "warning: unsupported PLATFORM_NAME='$PLATFORM_NAME' — skipping compose resources"; exit 0 ;;
          esac
          SRC="$SRCROOT/../shared/build/kotlin-multiplatform-resources/aggregated-resources/$KMP_TARGET"
          DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete "$SRC/" "$DST/"
            echo "Copied compose resources ($KMP_TARGET) into $DST"
          else
            echo "warning: no compose resources at $SRC — run the gradle framework build first"
          fi

  DjAppAi:
    type: application
    platform: iOS
    sources:
      - path: DjApp
        excludes:
          - Info.plist
    info:
      path: DjApp/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect MIDI controllers"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Required once linked against the iOS 27 SDK: without it UIKit traps on launch.
        # One scene only, since every window would share the single process-level graph.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.balch.djapp.app.ai
        PRODUCT_MODULE_NAME: DjAppAiApp
        APP_DISPLAY_NAME: "Orphic DJ AI"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "-DUSING_AI"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "DjAppAi"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # iPhone and iPad. iPad matters beyond the extra screen size: the large-screen
        # dock needs a canvas of at least 900x500dp, and an iPhone-only build runs
        # letterboxed at phone dimensions on an iPad, so it could never reach it. This
        # also activates the UISupportedInterfaceOrientations~ipad block above.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Fallback for ad-hoc Xcode builds; the archive script overrides both
        # from git (nearest tag / total commit count) — see build-logic's
        # orpheus.android.app.gradle.kts for the Android-side equivalent.
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "3"
      configs:
        Debug:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(inherited)"
            - "$(SRCROOT)/../ai/build/bin/iosArm64/debugFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(inherited)"
            - "$(SRCROOT)/../ai/build/bin/iosSimulatorArm64/debugFramework"
        Release:
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(inherited)"
            - "$(SRCROOT)/../ai/build/bin/iosArm64/releaseFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(inherited)"
            - "$(SRCROOT)/../ai/build/bin/iosSimulatorArm64/releaseFramework"

  DjWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DjWidgetExtension
        excludes:
          - Info.plist
          - DjWidgetExtension.entitlements
          - fixtures
      - path: DjAppWidgetShared
    info:
      path: DjWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: "Orphic DJ"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.balch.djapp.app.widget
        CODE_SIGN_ENTITLEMENTS: DjWidgetExtension/DjWidgetExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Orphic DJ"
        # Fallback for ad-hoc Xcode builds; the archive script overrides both
        # from git (nearest tag / total commit count) — see build-logic's
        # orpheus.android.app.gradle.kts for the Android-side equivalent.
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "3"
        SKIP_INSTALL: "YES"
        # No OTHER_LDFLAGS / FRAMEWORK_SEARCH_PATHS here — deliberate. The extension
        # never links DjAppShared; DjTransportIntent.swift only declares the button,
        # DjAppHost.perform() runs in the app process. Do not add a framework link
        # or a Compose-resources copy phase to this target.
        # iPhone and iPad, matching DjApp's TARGETED_DEVICE_FAMILY — a widget
        # extension can only appear on the device families its host app supports,
        # and DjApp's iPad support exists for the large-screen dock (900x500dp+).
        TARGETED_DEVICE_FAMILY: "1,2"

  DjWidgetExtensionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DjWidgetExtensionTests
      - path: DjWidgetExtension/fixtures
        buildPhase: resources
      - path: DjAppWidgetShared
    dependencies:
      - target: DjWidgetExtension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
