name: DjApp
options:
  bundleIdPrefix: org.balch.djapp
  deploymentTarget:
    iOS: "15.0"
settings:
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
targets:
  DjApp:
    type: application
    platform: iOS
    sources:
      - path: DjApp
        excludes:
          - Info.plist
    info:
      path: DjApp/Info.plist
      properties:
        CFBundleDisplayName: "Orphic DJ"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect MIDI controllers"
        UILaunchStoryboardName: LaunchScreen
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.balch.djapp.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
      FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "DjAppShared"
      ENABLE_USER_SCRIPT_SANDBOXING: "NO"
