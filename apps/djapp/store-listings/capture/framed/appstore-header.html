<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* App Store product page Header asset, 21:9. Render at 1920x823 with device scale 2 for 3840x1646. */
  html, body { margin: 0; width: 1920px; height: 823px; overflow: hidden; background: #0A0814; }
  body { position: relative; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  .viz { position: absolute; inset: -80px; background: url("../screenshots/new/tv-01.png") center 30% / cover;
         filter: blur(26px) saturate(1.7) brightness(.85); }
  .veil { position: absolute; inset: 0; background:
      radial-gradient(900px 420px at 50% 50%, rgba(10,8,20,.62), rgba(10,8,20,.15) 75%),
      linear-gradient(rgba(10,8,20,.35), rgba(10,8,20,.1) 40%, rgba(10,8,20,.55)); }
  .copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { margin: 0; font-size: 190px; font-weight: 800; letter-spacing: -5px; text-shadow: 0 8px 40px rgba(0,0,0,.6); }
  .bar { width: 300px; height: 14px; border-radius: 7px; margin: 20px 0 34px;
         background: linear-gradient(90deg, #36E0D0, #B14CFF, #FF5DC8); }
  p { margin: 0; font-size: 58px; font-weight: 600; letter-spacing: 3px; color: #F4F1FE; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="viz"></div>
  <div class="veil"></div>
  <div class="copy">
    <h1>ORPHIC DJ</h1>
    <div class="bar"></div>
    <p>Easy. Playful. Infinite.</p>
  </div>
</body>
</html>
