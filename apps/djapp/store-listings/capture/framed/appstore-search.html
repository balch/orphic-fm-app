<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* App Store Search Results asset, 3:2. Render at 1920x1280 with device scale 2 for 3840x2560. */
  html, body { margin: 0; width: 1920px; height: 1280px; overflow: hidden; background: #0A0814; }
  body { position: relative; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 12% 0%, rgba(54,224,208,.22), transparent 70%),
      radial-gradient(1000px 800px at 95% 100%, rgba(224,64,251,.26), transparent 70%),
      linear-gradient(#0C0A1C, #0A0814 52%, #0D0A1E); }
  .copy { position: absolute; left: 150px; top: 330px; width: 900px; }
  h1 { margin: 0; font-size: 190px; line-height: .95; font-weight: 800; letter-spacing: -6px; }
  .bar { width: 260px; height: 16px; border-radius: 8px; margin: 54px 0 46px;
         background: linear-gradient(90deg, #36E0D0, #B14CFF, #FF5DC8); }
  p { margin: 0; font-size: 62px; font-weight: 600; color: #C9C4E8; line-height: 1.25; }
  .phone { position: absolute; right: 190px; top: 90px; width: 620px; border-radius: 70px;
           transform: rotate(5deg); border: 10px solid #23232B;
           box-shadow: 0 50px 120px rgba(0,0,0,.7), 0 0 90px rgba(224,64,251,.25); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="copy">
    <h1>Play It<br>Live</h1>
    <div class="bar"></div>
    <p>Drop effects on the fly.<br>No two sets alike.</p>
  </div>
  <img class="phone" src="../../app-store/iphone-69/04.png" alt="">
</body>
</html>
