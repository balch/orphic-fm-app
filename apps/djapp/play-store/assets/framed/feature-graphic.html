<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; background: #0A0814; }
  svg { display: block; }
</style>
</head>
<body>
  <!--
    Orphic DJ feature graphic (1024x500, no alpha) — "by the numbers".
    Render to PNG (matches the screenshot-framing pipeline):
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
        --window-size=1024,500 --screenshot=feature-graphic-1024x500.png \
        "file://$PWD/feature-graphic.html"
    The Orpheus label art is the real app emblem, referenced relatively so it
    works on any checkout. Edit the COUNTS below, not the layout, for routine updates.
  -->
  <svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">Orphic DJ feature graphic</title>
    <desc id="d">Orphic DJ wordmark and a turntable with Orpheus at center, beside a count of vibes, visualizations, tracks, mixer controls, knobs, turntables, the widget, and infinite music.</desc>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0C0A1C"/>
        <stop offset="0.52" stop-color="#0A0814"/>
        <stop offset="1" stop-color="#0D0A1E"/>
      </linearGradient>
      <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#36E0D0"/>
        <stop offset="0.5" stop-color="#B14CFF"/>
        <stop offset="1" stop-color="#FF5DC8"/>
      </linearGradient>
      <linearGradient id="accentV" gradientUnits="userSpaceOnUse" x1="600" y1="78" x2="600" y2="468">
        <stop offset="0" stop-color="#36E0D0"/>
        <stop offset="0.5" stop-color="#B14CFF"/>
        <stop offset="1" stop-color="#FF5DC8"/>
      </linearGradient>
      <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#36E0D0" stop-opacity="0.20"/>
        <stop offset="1" stop-color="#36E0D0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowMag" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#E040FB" stop-opacity="0.20"/>
        <stop offset="1" stop-color="#E040FB" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="emblemClip"><circle cx="252" cy="332" r="40"/></clipPath>
    </defs>

    <rect x="0" y="0" width="1024" height="500" fill="url(#bg)"/>
    <ellipse cx="150" cy="-30" rx="430" ry="300" fill="url(#glowTeal)"/>
    <ellipse cx="920" cy="540" rx="430" ry="300" fill="url(#glowMag)"/>

    <g>
      <circle cx="252" cy="332" r="106" fill="#A6AAB6"/>
      <circle cx="252" cy="332" r="106" fill="none" stroke="#23232B" stroke-width="6" stroke-dasharray="2 14"/>
      <circle cx="252" cy="332" r="98" fill="#0B0912"/>
      <circle cx="252" cy="332" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="252" cy="332" r="81" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="252" cy="332" r="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="252" cy="332" r="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="252" cy="332" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="252" cy="332" r="40" fill="#201840"/>
      <image href="../../../androidApp/src/main/res/mipmap-xxxhdpi/orpheus_emblem.png" x="212" y="292" width="80" height="80" clip-path="url(#emblemClip)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="252" cy="332" r="44" fill="none" stroke="#E23A4B" stroke-width="5"/>
    </g>

    <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="44" y="108" font-size="60" font-weight="800" letter-spacing="-2" fill="#FFFFFF">ORPHIC DJ</text>
      <rect x="46" y="128" width="118" height="7" rx="3" fill="url(#accentH)"/>
      <text x="48" y="171" font-size="21" font-weight="600" letter-spacing="4" fill="#C9C4E8">AN INTERACTIVE ALBUM</text>

      <text x="600" y="95" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">11</text>
      <text x="624" y="95" font-size="25" font-weight="600" fill="#F4F1FE">Visualizations</text>
      <text x="600" y="147" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">9</text>
      <text x="624" y="147" font-size="25" font-weight="600" fill="#F4F1FE">Original Vibes</text>
      <text x="600" y="199" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">8</text>
      <text x="624" y="199" font-size="25" font-weight="600" fill="#F4F1FE">Generative Tracks</text>
      <text x="600" y="251" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">5</text>
      <text x="624" y="251" font-size="25" font-weight="600" fill="#F4F1FE">Mixer Controls</text>
      <text x="600" y="303" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">4</text>
      <text x="624" y="303" font-size="25" font-weight="600" fill="#F4F1FE">Ambiance Knobs</text>
      <text x="600" y="355" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">2</text>
      <text x="624" y="355" font-size="25" font-weight="600" fill="#F4F1FE">Turntables</text>
      <text x="600" y="407" font-size="44" font-weight="800" text-anchor="end" fill="url(#accentV)">1</text>
      <text x="624" y="407" font-size="25" font-weight="600" fill="#F4F1FE">App Widget</text>
      <line x1="556" y1="432" x2="980" y2="432" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
      <text x="600" y="466" font-size="50" font-weight="800" text-anchor="end" fill="url(#accentV)">&#8734;</text>
      <text x="624" y="464" font-size="27" font-weight="700" fill="#FFFFFF">Infinite Music</text>
    </g>
  </svg>
</body>
</html>
