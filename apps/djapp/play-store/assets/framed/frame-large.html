<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A0814;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }

  /* Landscape sibling of frame.html, for tablet and iPad shots. Sizes are in vw so one
     template serves every large-screen size; set the canvas with Chrome's --window-size
     and the type scales with it. Portrait frame.html stays the phone template. */
  .frame {
    width: 100vw;
    height: 100vh;
    padding: 4.2vw 4.6vw 3.4vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      radial-gradient(120% 80% at 50% -8%, rgba(54, 224, 208, 0.18), transparent 55%),
      radial-gradient(120% 90% at 50% 112%, rgba(224, 64, 251, 0.18), transparent 55%),
      linear-gradient(180deg, #0C0A1C 0%, #0A0814 52%, #0D0A1E 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  .caption { text-align: center; width: 100%; }

  .headline {
    color: #FFFFFF;
    font-size: 3.5vw;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.09vw;
    white-space: pre-line;
    text-shadow: 0 0.1vw 1.2vw rgba(0, 0, 0, 0.45);
    margin: 0;
  }

  .accent {
    width: 5.2vw;
    height: 0.3vw;
    border-radius: 0.2vw;
    margin: 1.5vw auto 1.3vw;
    background: linear-gradient(90deg, #36E0D0 0%, #B14CFF 50%, #FF5DC8 100%);
    box-shadow: 0 0 1.2vw rgba(177, 76, 255, 0.55);
  }

  .subhead {
    color: #C9C4E8;
    font-size: 1.75vw;
    font-weight: 500;
    line-height: 1.32;
    letter-spacing: 0.01vw;
    margin: 0 auto;
    max-width: 62vw;
  }

  .shot-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    margin-top: 2.6vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shot {
    max-height: 100%;
    max-width: 92%;
    border-radius: 1.4vw;
    border: 0.06vw solid rgba(255, 255, 255, 0.10);
    box-shadow:
      0 2.2vw 4.8vw rgba(0, 0, 0, 0.60),
      0 0 3vw rgba(54, 224, 208, 0.10);
  }

  /* Portrait (iPad 13" is 2064x2752). vw-derived type is tuned for landscape, where the
     canvas is wide; in portrait the same fractions come out tiny against the tall canvas,
     so the scale roughly doubles to keep the caption reading like the phone frames. */
  @media (max-aspect-ratio: 1/1) {
    .frame { padding: 8vw 6.5vw 7vw; }
    .headline { font-size: 6.2vw; letter-spacing: -0.16vw; }
    .subhead { font-size: 3.1vw; max-width: 84vw; }
    .accent { width: 9.6vw; height: 0.55vw; border-radius: 0.35vw; margin: 2.8vw auto 2.4vw; }
    .shot-wrap { margin-top: 5vw; }
    .shot { max-width: 88%; border-radius: 2.6vw; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="caption">
      <h1 class="headline" id="headline"></h1>
      <div class="accent"></div>
      <p class="subhead" id="subhead"></p>
    </div>
    <div class="shot-wrap">
      <img class="shot" id="shot" alt="" />
    </div>
  </div>

  <script>
    // Each entry produces one landscape large-screen frame. Render with e.g.
    //   --window-size=2560,1600 (tablet) or --window-size=2752,2064 (iPad 13").
    const FRAMES = [
      {
        img: "../screenshots/large-01-dock.png",
        headline: "The whole rig,\non one screen",
        subhead: "Deck, mixer, macros and timer — no tabbing, no hunting",
      },
      {
        img: "../screenshots/large-02-catalog.png",
        headline: "Eleven vibes,\nendless variations",
        subhead: "From swampy heartland rock to deep ambient drift",
      },
      {
        img: "../screenshots/large-03-storm.png",
        headline: "Songs with weather",
        subhead: "Rain, thunder that rolls past, lightning that cracks",
      },
    ];

    const idx = Math.max(0, parseInt((location.hash || "#0").slice(1), 10) || 0);
    const f = FRAMES[idx] || FRAMES[0];
    document.getElementById("headline").textContent = f.headline;
    document.getElementById("subhead").textContent = f.subhead;
    document.getElementById("shot").src = f.img;
  </script>
</body>
</html>
