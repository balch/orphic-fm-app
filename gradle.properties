#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
# WASM/JS incremental compilation workaround (KT-82395)
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
# Enable cinterop commonization for shared iOS source sets (iosMain, appleMain, nativeMain)
kotlin.mpp.enableCInteropCommonization=true
#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Compose Hot Reload (Experimental)
org.jetbrains.compose.reload.enabled=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
compose.desktop.packaging.checkJdkVendor=false
# R8 full mode (AGP 8+ default) aggressively rewrites @kotlin.Metadata and strips generic
# type parameters from classes it obfuscates, breaking kotlin-reflect at runtime. Koog builds
# its agent graph from delegated DSL builders that kotlin-reflect resolves via metadata
# (typeOf<T>() inside nodeLLMRequestStreaming), so full mode crashed the release agent flow
# with "Class declares 0 type parameters, but 1 were provided" (after the Function2-rename
# crash was fixed via -keepnames). Disabling full mode restores ProGuard-compatible metadata
# handling — the documented, standard fix for reflection-heavy libraries under R8.
android.enableR8.fullMode=false