name: Deploy WASM to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-wasm.yml'
      - 'apps/composeApp/**'
      - 'core/**'
      - 'features/**'
      - 'ui/**'
      - 'liborpheus_dsp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

concurrency:
  group: deploy-wasm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure WASM DSP build dir exists
        run: mkdir -p liborpheus_dsp/platform/wasm/build

      - name: Build WASM production distribution
        run: ./gradlew :apps:composeApp:wasmJsBrowserDistribution

      - name: Deploy to GitHub Pages repo
        env:
          DEPLOY_KEY: ${{ secrets.ORPHIC_FM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          DIST_DIR="apps/composeApp/build/dist/wasmJs/productionExecutable"

          if [[ ! -f "$DIST_DIR/index.html" ]]; then
            echo "::error::Build output missing at $DIST_DIR"
            exit 1
          fi

          # Configure SSH for deploy key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key"

          # Clone target repo
          git clone --depth 1 git@github.com:balch/orphic-fm.git /tmp/deploy

          # Replace all contents (keep .git)
          cd /tmp/deploy
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/$DIST_DIR"/. .
          touch .nojekyll

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          SOURCE_SHA="${GITHUB_SHA::7}"
          git commit -m "Deploy orphic-fm-app@${SOURCE_SHA} ($(date -u +%Y-%m-%d))"
          git push origin main
          echo "Deployed successfully."

          # Clean up deploy key
          rm -f ~/.ssh/deploy_key
