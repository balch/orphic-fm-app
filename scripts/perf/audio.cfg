# Perfetto trace config — audio-focused.
#
# Surfaces:
#   - Oboe callback timing and misses (audio atrace category)
#   - Audio-thread scheduling, preemption, and CPU frequency
#   - JNI -> C++ DSP stalls (sched + dalvik)
#   - Lock contention and binder hops touching the audio thread
#
# Intentional omissions: gfx/view/wm (use ui.cfg for those). Keeps traces
# small enough that trace_processor SQL stays snappy.

buffers {
    size_kb: 65536
    fill_policy: RING_BUFFER
}
buffers {
    size_kb: 8192
    fill_policy: RING_BUFFER
}

data_sources {
    config {
        name: "linux.ftrace"
        ftrace_config {
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            ftrace_events: "sched/sched_wakeup_new"
            ftrace_events: "sched/sched_process_exit"
            ftrace_events: "sched/sched_process_free"
            ftrace_events: "task/task_newtask"
            ftrace_events: "task/task_rename"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"
            ftrace_events: "power/suspend_resume"
            atrace_categories: "sched"
            atrace_categories: "freq"
            atrace_categories: "audio"
            atrace_categories: "binder_driver"
            atrace_categories: "binder_lock"
            atrace_categories: "dalvik"
            atrace_categories: "am"
            atrace_apps: "org.balch.orpheus"
            atrace_apps: "org.balch.orpheus.debug"
            atrace_apps: "org.balch.djapp"
            atrace_apps: "org.balch.djapp.debug"
            buffer_size_kb: 16384
            drain_period_ms: 250
        }
    }
}

data_sources {
    config {
        name: "linux.process_stats"
        target_buffer: 1
        process_stats_config {
            scan_all_processes_on_start: true
        }
    }
}

data_sources {
    config {
        name: "linux.sys_stats"
        sys_stats_config {
            stat_period_ms: 1000
            stat_counters: STAT_CPU_TIMES
            stat_counters: STAT_FORK_COUNT
        }
    }
}

duration_ms: 10000
