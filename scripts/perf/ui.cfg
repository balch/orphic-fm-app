# Perfetto trace config — graphics / Compose UI focused.
#
# Surfaces:
#   - Compose recomposition + draw frames (view, gfx)
#   - Frame deadlines, missed vsyncs (gfx)
#   - Liquid-glass effect cost (custom traces under "view" / "gfx")
#   - Touch latency (input)
#   - SurfaceFlinger composition (wm)
#
# Pairs with audio.cfg — capture both back-to-back for cross-domain analysis.

buffers {
    size_kb: 65536
    fill_policy: RING_BUFFER
}
buffers {
    size_kb: 8192
    fill_policy: RING_BUFFER
}

data_sources {
    config {
        name: "linux.ftrace"
        ftrace_config {
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            ftrace_events: "sched/sched_wakeup_new"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"
            atrace_categories: "sched"
            atrace_categories: "freq"
            atrace_categories: "gfx"
            atrace_categories: "view"
            atrace_categories: "input"
            atrace_categories: "wm"
            atrace_categories: "am"
            atrace_categories: "dalvik"
            atrace_apps: "org.balch.orpheus"
            atrace_apps: "org.balch.orpheus.debug"
            atrace_apps: "org.balch.djapp"
            atrace_apps: "org.balch.djapp.debug"
            buffer_size_kb: 16384
            drain_period_ms: 250
        }
    }
}

data_sources {
    config {
        name: "linux.process_stats"
        target_buffer: 1
        process_stats_config {
            scan_all_processes_on_start: true
        }
    }
}

duration_ms: 10000
